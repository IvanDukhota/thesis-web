name: Full Project CI/CD

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Backend unit tests
  #   Runs on all pushes and PRs.
  #   Uses pgvector/pgvector image so migrations succeed.
  #   ci.py settings replace Redis with in-memory equivalents.
  # ──────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: teamhub_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ci_user:ci_pass@localhost:5432/teamhub_ci
      DJANGO_SETTINGS_MODULE: config.settings.ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ci_pass psql -h localhost -U ci_user -d template1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run unit tests
        working-directory: backend
        run: |
          python manage.py test \
            apps.users \
            apps.projects \
            apps.tasks \
            tests \
            --verbosity=2

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Frontend checks
  #   feature/** push: lint + TypeScript type-check (fast, no bundle)
  #   develop / main / PR: lint + full Vite build (catches all errors)
  # ──────────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Fast path for feature branches: type-check without bundling
      - name: TypeScript type check
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        working-directory: frontend
        run: npx tsc --noEmit

      # Full build for develop, main and any PR
      - name: Build
        if: >
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/main' ||
          github.event_name == 'pull_request'
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Docker integration smoke test
  #   Spins up the full docker-compose stack and checks connectivity.
  #   Runs on develop, main and PRs targeting those branches.
  # ──────────────────────────────────────────────────────────────
  integration-smoke-test:
    name: Integration Smoke Test
    needs: [backend-unit, frontend-checks]
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start all services
        run: docker compose up -d --build

      - name: Wait for services to warm up
        run: sleep 30

      - name: Health check — frontend
        run: |
          curl -f http://localhost:3000 \
            || (docker compose logs frontend && exit 1)

      - name: Health check — backend API
        run: |
          curl -f http://localhost:8000/api/v1/health/ \
            || (docker compose logs backend && exit 1)

      - name: Print running containers
        run: docker ps

      - name: Teardown
        if: always()
        run: docker compose down

  # ──────────────────────────────────────────────────────────────
  # Job 4 — Docker Hub publish
  #   Runs only on direct pushes to main (not on PRs).
  #   Builds backend and frontend images separately and pushes them.
  # ──────────────────────────────────────────────────────────────
  docker-deploy:
    name: Push to Docker Hub
    needs: integration-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/teamhub-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/teamhub-frontend:latest
