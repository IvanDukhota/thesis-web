name: Full Project CI/CD

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Backend unit tests
  # ──────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: teamhub_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ci_user:ci_pass@localhost:5432/teamhub_ci
      DJANGO_SETTINGS_MODULE: config.settings.ci
      SECRET_KEY: ci-test-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ci_pass psql -h localhost -U ci_user -d template1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=ci_pass psql -h localhost -U ci_user -d teamhub_ci \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run unit tests
        working-directory: backend
        run: |
          python manage.py test \
            apps.users \
            apps.projects \
            apps.tasks \
            apps.marketplace \
            apps.messages \
            apps.chats \
            tests \
            --verbosity=2

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Frontend checks
  # ──────────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: >
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/main' ||
          github.event_name == 'pull_request'
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Security scan (secrets + dependency audit)
  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Python dependency audit
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────────────────────────
  # Job 4 — Docker integration smoke test
  #   Запускає тільки core-сервіси (без ML/AI та моніторингу).
  #   Runs on develop, main and PRs targeting those branches.
  # ──────────────────────────────────────────────────────────────
  integration-smoke-test:
    name: Integration Smoke Test
    needs: [backend-unit, frontend-checks]
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=teamhub_ci
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_smoke_pass
          SECRET_KEY=smoke-test-secret-key-for-ci-only
          ALLOWED_HOSTS=localhost,127.0.0.1,backend
          CORS_ALLOW_ALL_ORIGINS=false
          MINIO_ROOT_USER=minio_ci
          MINIO_ROOT_PASSWORD=minio_ci_pass
          AWS_STORAGE_BUCKET_NAME=teamhub-media
          AWS_S3_CUSTOM_DOMAIN=localhost:9000/teamhub-media
          GRAFANA_ADMIN_PASSWORD=grafana_ci
          VITE_DESKTOP_WIN_URL=http://localhost:9000/teamhub-releases/TeamHub-Setup.exe
          EOF

      - name: Build and start core services
        run: docker compose up -d --build db redis minio minio-init backend frontend

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health/; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Health check — frontend
        run: |
          curl -f http://localhost:3000 \
            || (docker compose logs frontend && exit 1)

      - name: Health check — backend API
        run: |
          curl -f http://localhost:8000/api/v1/health/ \
            || (docker compose logs backend && exit 1)

      - name: Print running containers
        run: docker ps

      - name: Teardown
        if: always()
        run: docker compose down

  # ──────────────────────────────────────────────────────────────
  # Job 5 — Docker Hub publish
  #   Runs only on direct pushes to main (not on PRs).
  #   Tags image with both :latest and :<git-sha> for rollback.
  # ──────────────────────────────────────────────────────────────
  docker-deploy:
    name: Push to Docker Hub
    needs: integration-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/teamhub-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/teamhub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/teamhub-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/teamhub-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
