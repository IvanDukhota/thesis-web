services:
  # Database (PostgreSQL)
  db:
    build: ./db
    container_name: teamhub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [teamhub]

  # Redis (Celery broker, Channels, cache)
  redis:
    image: redis:7-alpine
    container_name: teamhub-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [teamhub]

  # Backend (Django + uvicorn ASGI)
  backend:
    build: ./backend
    container_name: teamhub-backend
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_S3=true
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_CUSTOM_DOMAIN=${AWS_S3_CUSTOM_DOMAIN}
      - AWS_S3_USE_SSL=false
      - OLLAMA_SERVICE_URL=http://ollama:11434
      - EMBEDDING_SERVICE_URL=http://embedding-service:8002
      - RERANKER_SERVICE_URL=http://reranker-service:8003
      - USE_TRANSLATION_API=true
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    networks: [teamhub]

  # Celery Worker (translations, embeddings)
  celery:
    build: ./backend
    container_name: teamhub-celery
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_SERVICE_URL=http://ollama:11434
      - EMBEDDING_SERVICE_URL=http://embedding-service:8002
      - USE_TRANSLATION_API=true
      - USE_S3=true
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_USE_SSL=false
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info -Q translation_high,translation_medium,translation_low,celery
    restart: unless-stopped
    networks: [teamhub]

  # Embedding Service (FastAPI + multilingual-e5-base)
  embedding-service:
    build: ./embedding-service
    container_name: teamhub-embedding
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks: [teamhub]

  # Reranker Service (FastAPI + cross-encoder)
  reranker-service:
    build: ./reranker-service
    container_name: teamhub-reranker
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks: [teamhub]

  # Ollama LLM (Qwen2.5-7b) — запускається тільки з: docker compose --profile ai up
  ollama:
    image: ollama/ollama:latest
    container_name: teamhub-ollama
    ports:
      - "8001:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    profiles: ["ai"]
    networks: [teamhub]

  # Ollama Model Loader
  ollama-init:
    image: ollama/ollama:latest
    container_name: teamhub-ollama-init
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Waiting for Ollama service...';
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        if ! ollama list | grep -q 'qwen2.5:7b'; then
          echo 'Downloading qwen2.5:7b model...';
          ollama pull qwen2.5:7b;
          echo 'Model downloaded successfully!';
        else
          echo 'Model qwen2.5:7b already exists, skipping download.';
        fi
    profiles: ["ai"]
    networks: [teamhub]

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: teamhub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [teamhub]

  # MinIO Client (створення bucket при першому запуску)
  minio-init:
    image: minio/mc:latest
    container_name: teamhub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/$${AWS_STORAGE_BUCKET_NAME} --ignore-existing;
      mc anonymous set download myminio/$${AWS_STORAGE_BUCKET_NAME};
      exit 0;
      "
    networks: [teamhub]

  # Frontend (React + Vite dev server)
  frontend:
    image: node:22-alpine
    container_name: teamhub-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_WS_PROXY_TARGET=ws://backend:8000
      - VITE_DESKTOP_WIN_URL=${VITE_DESKTOP_WIN_URL}
    command: sh -c "npm ci && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped
    networks: [teamhub]

  # Prometheus (метрики)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: teamhub-prometheus
    user: "0"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks: [teamhub]

  # cAdvisor (метрики контейнерів)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: teamhub-cadvisor
    ports:
      - "9091:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
    restart: unless-stopped
    networks: [teamhub]

  # Node Exporter (системні метрики хоста)
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: teamhub-node-exporter
    ports:
      - "9092:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks: [teamhub]

  # Redis Exporter (метрики Redis)
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: teamhub-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [teamhub]

  # Postgres Exporter (метрики PostgreSQL)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: teamhub-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [teamhub]

  # Loki (агрегація логів)
  loki:
    image: grafana/loki:3.0.0
    container_name: teamhub-loki
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [teamhub]

  # Promtail (збір логів з Docker)
  promtail:
    image: grafana/promtail:3.0.0
    container_name: teamhub-promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks: [teamhub]

  # Grafana (візуалізація)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: teamhub-grafana
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks: [teamhub]

  # DB Backup (автоматичний pg_dump на розклад)
  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: teamhub-db-backup
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=${BACKUP_SCHEDULE:-@daily}
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - backups_data:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [teamhub]

networks:
  teamhub:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  loki_data:
  grafana_data:
  prometheus_data:
  ollama_data:
  backups_data:
