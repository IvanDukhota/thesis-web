version: '3.8'

services:
  # Database (PostgreSQL)
  db:
    image: postgres:15
    container_name: teamhub-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: teamhub_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d teamhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (для Celery broker, Channels, и кэша)
  redis:
    image: redis:7-alpine
    container_name: teamhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend (Django + Daphne)
  backend:
    build: ./backend
    container_name: teamhub-backend
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/teamhub_db
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_S3=true
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=teamhub-media
      - AWS_S3_CUSTOM_DOMAIN=localhost:9000/teamhub-media
      - AWS_S3_USE_SSL=false
      - TRANSLATION_SERVICE_URL=http://translation-service:8001
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOW_ALL_ORIGINS=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  # Celery Worker (обработка переводов)
  celery:
    build: ./backend
    container_name: teamhub-celery
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/teamhub_db
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRANSLATION_SERVICE_URL=http://translation-service:8001
      - USE_S3=true
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=teamhub-media
      - AWS_S3_USE_SSL=false
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info -Q translation_high,translation_medium,translation_low

  # Translation Service (FastAPI + NLLB-200)
  translation-service:
    build: ./translation-service
    container_name: teamhub-translation
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: teamhub-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Client (для автоматического создания bucket)
  minio-init:
    image: minio/mc:latest
    container_name: teamhub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/teamhub-media --ignore-existing;
      mc anonymous set download myminio/teamhub-media;
      exit 0;
      "

  # Frontend (React)
  frontend:
    build: ./frontend
    container_name: teamhub-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data: