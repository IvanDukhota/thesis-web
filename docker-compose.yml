version: '3.8'

services:
  # Database (PostgreSQL)
  db:
    build: ./db
    container_name: teamhub-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: teamhub_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d teamhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (для Celery broker, Channels, и кэша)
  redis:
    image: redis:7-alpine
    container_name: teamhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend (Django + Daphne)
  backend:
    build: ./backend
    container_name: teamhub-backend
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/teamhub_db
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_S3=true
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=teamhub-media
      - AWS_S3_CUSTOM_DOMAIN=localhost:9000/teamhub-media
      - AWS_S3_USE_SSL=false
      - TRANSLATION_SERVICE_URL=http://translation-service:8001
      - EMBEDDING_SERVICE_URL=http://embedding-service:8002
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOW_ALL_ORIGINS=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --reload --host 0.0.0.0 --port 8000"

  # Celery Worker (обработка переводов и эмбеддингов)
  celery:
    build: ./backend
    container_name: teamhub-celery
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/teamhub_db
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRANSLATION_SERVICE_URL=http://translation-service:8001
      - EMBEDDING_SERVICE_URL=http://embedding-service:8002
      - USE_S3=true
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=teamhub-media
      - AWS_S3_USE_SSL=false
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info -Q translation_high,translation_medium,translation_low,celery

  # Embedding Service (FastAPI + multilingual-e5-base)
  embedding-service:
    build: ./embedding-service
    container_name: teamhub-embedding
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Translation Service (FastAPI + NLLB-200)
  translation-service:
    build: ./translation-service
    container_name: teamhub-translation
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: teamhub-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Client (для автоматического создания bucket)
  minio-init:
    image: minio/mc:latest
    container_name: teamhub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/teamhub-media --ignore-existing;
      mc anonymous set download myminio/teamhub-media;
      exit 0;
      "

  # Frontend (React — Vite dev server with HMR)
  frontend:
    image: node:20-alpine
    container_name: teamhub-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_WS_PROXY_TARGET=ws://backend:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: teamhub-prometheus
    user: "0"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: teamhub-cadvisor
    ports:
      - "9091:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'

  loki:
    image: grafana/loki:3.0.0
    container_name: teamhub-loki
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.0.0
    container_name: teamhub-promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    container_name: teamhub-grafana
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  loki_data:
  grafana_data:
  prometheus_data: